{% extends "base.html" %}
{% block title %}Map — CivicSync{% endblock %}
{% block content %}
<div class="card">
  <h1>Public works map</h1>
  <p class="muted">Legend:
    <span class="pin green"></span> official projects
    <span class="pin blue"></span> citizen reports
    <span class="pin orange"></span> conflict alerts
    <span class="pin purple"></span> coordinated work</p>
  <label>Layer</label><select id="map-kind"><option value="">All layers</option><option value="project">Projects</option><option value="citizen_report">Citizen reports</option><option value="conflict">Conflicts</option><option value="joint">Joint work</option></select>
  <label>Status</label><select id="map-filter-status"><option value="">All statuses</option><option>approved</option><option>in_progress</option><option>delayed</option><option>completed</option><option>verified_complete</option><option>published</option></select>
  <label>Department</label><input id="map-department" placeholder="Filter department name">
  <label><input type="checkbox" id="map-heat"> Show density heatmap</label>
  <div id="mapid" data-mapdata-url="{{ url_for('public.map_data') }}"></div>
  <div id="mapstatus" class="muted">Loading map data…</div>
</div>
{% endblock %}
{% block scripts %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="{{ url_for('static', filename='public-map.js') }}"></script>
{% endblock %}
